<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>행사기록 · 초록별 환경놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
:root{--paper:#FDF6E9;--paper2:#fff;--ink:#4A3526;--soft:#8A7461;--green:#3E8E41;--orange:#EE8424;
 --blue:#2F5DA8;--yellow:#F2C018;--pink:#E27BA7;--sky:#7EC4E2;--brown:#6B4A2B;--leaf:#8BC34A;--line:#E3D7C2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:19px;line-height:1.6}
a{color:var(--green)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* 머리 */
header{text-align:center;padding:30px 16px 6px}
header h1{font-family:"Gamja Flower",sans-serif;font-weight:400;font-size:clamp(32px,7vw,46px);margin:0 0 4px;color:var(--green)}
header .sub{color:var(--soft);font-family:"Gamja Flower",sans-serif;font-size:clamp(15px,3vw,19px)}
.back{display:inline-block;margin-top:10px;text-decoration:none;font-family:"Gamja Flower",sans-serif;
 font-size:18px;border:2.5px solid var(--green);color:var(--green);border-radius:16px 12px 18px 11px;padding:4px 14px 3px;background:#fff9}
/* 자물쇠 */
#gate{min-height:76vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock{background:#fff;border:3px solid var(--line);border-radius:26px 18px 28px 20px;padding:32px 28px;max-width:420px;width:100%;text-align:center}
.lock .lk{font-size:46px;line-height:1.1}
.lock h2{font-family:"Gamja Flower",sans-serif;font-weight:400;margin:.25em 0 .1em;font-size:29px;color:var(--green)}
.lock p{color:var(--soft);margin:.2em 0 1.1em;font-size:18px}
.lock input{width:100%;padding:13px 14px;font-size:23px;letter-spacing:.14em;text-align:center;
 border:3px solid var(--line);border-radius:14px;font-family:inherit;background:var(--paper);color:var(--ink)}
.lock input:focus{outline:none;border-color:var(--green)}
.lock button{margin-top:11px;width:100%;padding:13px;font-size:21px;font-family:"Gamja Flower",sans-serif;
 background:var(--green);color:#fff;border:0;border-radius:14px;cursor:pointer}
.lock button:disabled{opacity:.55;cursor:default}
.err{color:#C0392B;min-height:1.5em;font-size:18px;margin-top:8px}
.hint{color:var(--soft);font-size:16px;margin-top:12px;font-family:"Gamja Flower",sans-serif}
/* 탭 */
#main{display:none}
nav.tabs{position:sticky;top:0;z-index:30;background:rgba(253,246,233,.95);backdrop-filter:blur(6px);
 border-bottom:3px dashed rgba(107,74,43,.18)}
nav.tabs .in{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;
 max-width:1180px;margin:0 auto;scroll-snap-type:x proximity;scroll-behavior:smooth}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;scroll-snap-align:center;font-family:"Gamja Flower",sans-serif;font-size:19px;
 padding:5px 14px 4px;border-radius:18px 14px 20px 12px;border:2.5px solid var(--c,var(--green));
 color:var(--c,var(--green));background:#fff9;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--c,var(--green));color:#fff}
nav.tabs{position:sticky}
nav.tabs::before,nav.tabs::after{content:"";position:absolute;top:0;bottom:3px;width:34px;pointer-events:none;opacity:0;transition:opacity .18s;z-index:2}
nav.tabs::before{left:0;background:linear-gradient(90deg,rgba(253,246,233,.97),rgba(253,246,233,0))}
nav.tabs::after{right:0;background:linear-gradient(270deg,rgba(253,246,233,.97),rgba(253,246,233,0))}
nav.tabs.can-l::before{opacity:1} nav.tabs.can-r::after{opacity:1}
@media(min-width:1000px){nav.tabs .in{flex-wrap:wrap;justify-content:center;overflow:visible}
 nav.tabs::before,nav.tabs::after{display:none}}
/* 공통 */
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;margin:16px 0 4px}
.bar .cnt{color:var(--soft);font-family:"Gamja Flower",sans-serif;font-size:18px}
.bar button{font-family:"Gamja Flower",sans-serif;font-size:17px;padding:6px 14px 5px;border-radius:14px 11px 16px 10px;
 border:2.5px solid var(--green);background:#fff;color:var(--green);cursor:pointer}
.bar button.on{background:var(--green);color:#fff}
.bar button:disabled{opacity:.45;cursor:default}
/* 사진 격자 */
.pg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:14px 0 40px}
@media(max-width:560px){.pg{grid-template-columns:repeat(2,1fr);gap:6px}}
.ph{position:relative;aspect-ratio:3/2;background:#EDE3D0;border-radius:10px;overflow:hidden;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.ph img.in{opacity:1}
.ph .pick{position:absolute;left:6px;top:6px;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.88);
 border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--green);z-index:2}
.ph.sel{outline:4px solid var(--green);outline-offset:-4px}
.ph.sel .pick{background:var(--green);color:#fff;border-color:var(--green)}
/* 영상 */
.vg{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin:14px 0 36px}
.vc{background:#fff;border-radius:20px 14px 22px 16px;overflow:hidden;position:relative;border:3px solid var(--brown)}
.vt{display:block;aspect-ratio:16/9;background:#EDE3D0 center/cover no-repeat;position:relative}
.vt.v9{aspect-ratio:9/16;background-size:contain;background-color:#23221f}
.vt i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:42px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.vm{padding:11px 13px 13px}
.vm .t{font-size:20px;font-weight:700;line-height:1.25}
.vm .d{font-size:17px;color:var(--soft)}
.vm .n{font-size:15px;color:var(--soft);font-family:"Gamja Flower",sans-serif;margin-top:3px}
.vb{display:flex;gap:7px;margin-top:9px}
.vb a{flex:1;text-align:center;padding:8px 0;border-radius:11px;text-decoration:none;font-family:"Gamja Flower",sans-serif;font-size:18px}
.vb .g{background:var(--brown);color:#fff}.vb .w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
@media(max-width:619px){
 .vc.h{display:grid;grid-template-columns:42% 1fr}
 .vc.h .vt{aspect-ratio:auto;width:100%;height:100%;min-height:96px}
 .vg.sh{grid-template-columns:1fr 1fr}}
@media(min-width:620px){.vg.sh{grid-template-columns:repeat(4,1fr)}}
h3.gh{font-family:"Gamja Flower",sans-serif;font-weight:400;font-size:26px;color:var(--brown);text-align:center;margin:26px 0 0}
h3.gh small{display:block;font-size:.6em;color:var(--soft)}
/* 크게 보기 */
#lb{position:fixed;inset:0;background:rgba(32,24,16,.94);z-index:100;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:6px}
#lb .x,#lb .pv,#lb .nx{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;cursor:pointer;
 font-size:30px;width:52px;height:52px;border-radius:50%;line-height:1}
#lb .x{top:14px;right:14px}#lb .pv{left:10px}#lb .nx{right:10px}
#lb .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:17px;
 font-family:"Gamja Flower",sans-serif}
#lb .cap a{color:#ffe9a8;margin-left:10px}
footer{text-align:center;color:var(--soft);padding:30px 16px 56px;font-size:16px;font-family:"Gamja Flower",sans-serif}
</style></head><body>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const TH=(i,w)=>'https://drive.google.com/thumbnail?id='+i+'&sz=w'+(w||400);
const BIG=i=>'https://lh3.googleusercontent.com/d/'+i+'=s2048';
const DL=i=>'https://drive.google.com/uc?export=download&id='+i;
const VW=i=>'https://drive.google.com/file/d/'+i+'/view';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null, cur=[], sel=new Set(), lbi=0;

async function unlock(pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(BLOB.s),iterations:250000,hash:'SHA-256'},
    k,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(BLOB.i)},key,u8(BLOB.c));
  return JSON.parse(new TextDecoder().decode(p));
}
/* 게으른 불러오기 */
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;
  const im=e.target, id=im.dataset.id; if(!id)return;
  im.src=TH(id,420); im.removeAttribute('data-id');
  im.onload=()=>im.classList.add('in');
  im.onerror=()=>{im.onerror=null;im.src=TH(id,220);};
  io.unobserve(im);});},{rootMargin:'700px 0px'});

function photoPane(c){
  cur=c.f; sel.clear();
  const bar='<div class="bar"><span class="cnt">'+c.t+' · '+c.f.length+'장</span>'+
    '<button id="selAll">전부 고르기</button><button id="selNone">고른 것 지우기</button>'+
    '<button id="zip" disabled>고른 사진 받기</button><span class="cnt" id="selN"></span></div>'+
    '<div class="bar"><span class="cnt">사진을 누르면 크게 보입니다 · 왼쪽 위 네모를 누르면 골라집니다</span></div>';
  const g='<div class="pg">'+c.f.map((p,i)=>
    '<div class="ph" data-i="'+i+'"><span class="pick">&#10003;</span>'+
    '<img data-id="'+p[1]+'" alt="'+esc(p[0])+'" loading="lazy"></div>').join('')+'</div>';
  document.getElementById('pane').innerHTML=bar+g;
  document.querySelectorAll('.pg img').forEach(im=>io.observe(im));
  document.querySelector('.pg').addEventListener('click',e=>{
    const el=e.target.closest('.ph'); if(!el) return;
    const i=+el.dataset.i;
    if(e.target.classList.contains('pick')){
      if(sel.has(i)){sel.delete(i);el.classList.remove('sel');}else{sel.add(i);el.classList.add('sel');}
      updSel(); return;
    }
    openLb(i);
  });
  document.getElementById('selAll').onclick=()=>{cur.forEach((_,i)=>sel.add(i));
    document.querySelectorAll('.ph').forEach(e=>e.classList.add('sel'));updSel();};
  document.getElementById('selNone').onclick=()=>{sel.clear();
    document.querySelectorAll('.ph').forEach(e=>e.classList.remove('sel'));updSel();};
  document.getElementById('zip').onclick=zip;
  updSel();
}
function updSel(){
  const n=sel.size;
  document.getElementById('selN').textContent=n?n+'장 고름':'';
  document.getElementById('zip').disabled=!n;
  document.getElementById('zip').textContent=n?('고른 '+n+'장 받기'):'고른 사진 받기';
}
async function zip(){
  const b=document.getElementById('zip'); const ids=[...sel];
  if(!ids.length||!window.JSZip) return;
  b.disabled=true;
  const z=new JSZip(); let done=0;
  for(const i of ids){
    const [nm,id]=cur[i];
    b.textContent='받는 중 '+(++done)+'/'+ids.length;
    try{ const r=await fetch(BIG(id)); z.file(nm, await r.blob()); }catch(_){}
  }
  b.textContent='압축하는 중…';
  const out=await z.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(out);
  a.download='초록별_환경놀이터_사진_'+ids.length+'장.zip'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  b.disabled=false; updSel();
}
function vcard(v,sh){
  return '<div class="vc '+(sh?'':'h')+'"><a class="vt'+(sh?' v9':'')+'" href="'+VW(v.id)+
   '" target="_blank" rel="noopener" style="background-image:url(\''+TH(v.id,640)+'\')"><i>&#9654;</i></a>'+
   '<div class="vm"><div class="t">'+esc(v.t)+'</div><div class="d">'+esc(v.d)+'</div>'+
   '<div class="n">'+(v.len?esc(v.len)+' · ':'')+(v.mb?esc(v.mb)+'MB':'')+'</div>'+
   '<div class="vb"><a class="g" href="'+VW(v.id)+'" target="_blank" rel="noopener">보기</a>'+
   '<a class="w" href="'+DL(v.id)+'">받기</a></div></div></div>';
}
function videoPane(){
  const h=D.pr.filter(v=>v.o==='가로'), w=D.pr.filter(v=>v.o==='세로');
  document.getElementById('pane').innerHTML=
   '<h3 class="gh">기록용 영상<small>행사가 어떤 행사였는지 남기는 기록 · '+D.rec.length+'편</small></h3>'+
   '<div class="vg">'+D.rec.map(v=>vcard(v,false)).join('')+'</div>'+
   '<h3 class="gh">홍보용 영상<small>유튜브·SNS 공개용 · '+D.pr.length+'편</small></h3>'+
   '<div class="vg">'+h.map(v=>vcard(v,false)).join('')+'</div>'+
   '<div class="vg sh">'+w.map(v=>vcard(v,true)).join('')+'</div>';
}
/* 크게 보기 */
const lb=document.getElementById('lb'), lbimg=lb.querySelector('img'), lbcap=lb.querySelector('.cap');
function openLb(i){ lbi=i; const [nm,id]=cur[i];
  lbimg.src=BIG(id); lbimg.alt=nm;
  lbcap.innerHTML=esc(nm)+' ('+(i+1)+'/'+cur.length+')<a href="'+DL(id)+'">이 사진 받기</a>';
  lb.classList.add('on'); document.body.style.overflow='hidden'; }
function closeLb(){ lb.classList.remove('on'); lbimg.src=''; document.body.style.overflow=''; }
function step(d){ if(!cur.length)return; openLb((lbi+d+cur.length)%cur.length); }
lb.querySelector('.x').onclick=closeLb;
lb.querySelector('.pv').onclick=e=>{e.stopPropagation();step(-1);};
lb.querySelector('.nx').onclick=e=>{e.stopPropagation();step(1);};
lb.onclick=e=>{ if(e.target===lb||e.target===lbimg) closeLb(); };
addEventListener('keydown',e=>{ if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')closeLb(); if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1); });
/* 탭 */
const COL=['var(--brown)','var(--green)','var(--orange)','var(--blue)','var(--pink)','var(--leaf)','var(--sky)'];
function build(){
  const tabs=[{t:'영상',v:true}].concat(D.ph.filter(c=>c.f.length));
  const el=document.getElementById('tabs');
  el.innerHTML=tabs.map((c,i)=>'<button role="tab" data-i="'+i+'" style="--c:'+COL[i%COL.length]+'" '+
    'aria-selected="'+(i===0)+'">'+esc(c.t)+(c.v?'':' <small>'+c.f.length+'</small>')+'</button>').join('');
  el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    [...el.children].forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    const c=tabs[+b.dataset.i];
    c.v?videoPane():photoPane(c);
    scrollTo({top:0,behavior:'smooth'});
    if(getComputedStyle(el).flexWrap!=='wrap'){
      el.scrollTo({left:Math.max(0,b.offsetLeft-(el.clientWidth-b.offsetWidth)/2),behavior:'smooth'});}
  });
  videoPane();
  const n=document.querySelector('nav.tabs');
  const upd=()=>{const wrap=getComputedStyle(el).flexWrap==='wrap',over=el.scrollWidth-el.clientWidth>4;
    n.classList.toggle('can-l',!wrap&&over&&el.scrollLeft>4);
    n.classList.toggle('can-r',!wrap&&over&&el.scrollLeft<el.scrollWidth-el.clientWidth-4);};
  el.addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd); upd();
  document.getElementById('gate').style.display='none';
  document.getElementById('main').style.display='block';
}
const f=document.getElementById('lf'),pw=document.getElementById('pw'),
      err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{

  try{ D=await unlock(pw.value.trim());
       try{sessionStorage.setItem('recK',pw.value.trim());}catch(_){}
       build();

  finally{ go.disabled=false; go.textContent='열기'; }
});

pw.focus();
